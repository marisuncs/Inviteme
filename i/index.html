<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>inviteme</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Georgia', serif;
  background: #1e4a57;
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  color: rgba(255,255,255,0.8);
}
.logo { font-size: 28px; color: white; margin-bottom: 1.5rem; letter-spacing: -0.02em; }
.logo span { color: rgba(255,255,255,0.4); }
.spinner { width: 32px; height: 32px; border: 2px solid rgba(255,255,255,0.2); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.error { text-align: center; display: none; }
.error p { font-size: 16px; margin-bottom: 0.5rem; color: white; }
.error small { font-size: 13px; color: rgba(255,255,255,0.5); }
</style>
</head>
<body>

<p class="logo">invite<span>me</span></p>
<div id="spinner" class="spinner"></div>
<div id="error" class="error">
  <p>Link no encontrado</p>
  <small>Este link ya no es válido o expiró.</small>
</div>

<script>
const SUPA_URL = 'https://jlakoulrsnptdsslerte.supabase.co';
const SUPA_KEY = 'sb_publishable_lW75yG4gMJUC6kLkCABx9A_NihDmEEa';

async function api(path) {
  const res = await fetch(SUPA_URL + '/rest/v1/' + path, {
    headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY }
  });
  const t = await res.text(); return t ? JSON.parse(t) : null;
}

(async () => {
  const code = new URLSearchParams(window.location.search).get('c');
  if (!code) { showError(); return; }

  try {
    // Get short URL record
    const res = await api('short_urls?code=eq.' + code + '&select=guest_id,id_event');
    if (!res || !res[0]) { showError(); return; }

    const { guest_id, id_event } = res[0];

    // Get event slug
    const ev = await api('event_config?id_event=eq.' + id_event + '&select=slug');
    if (!ev || !ev[0]) { showError(); return; }

    // Redirect to invitation
    window.location.replace('https://inviteme.fun/e/?slug=' + ev[0].slug + '&id=' + guest_id);
  } catch(e) {
    showError();
  }
})();

function showError() {
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('error').style.display = 'block';
}
</script>
</body>
</html>
