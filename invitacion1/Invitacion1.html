<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gabo & Miya</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

</head>

<body>

    <div class="invitation">

        <!-- FONDO -->

        <img
            src="img/invitacion.jpg"
            class="bg"
            alt="Invitación">

        <!-- CONTENIDO -->

        <div class="content">

            <!-- NOMBRES -->

            <section class="hero">

                <h1>
                    Gabo
                    <span>&</span>
                    Miya
                </h1>

            </section>

            <!-- FRASE -->

            <section class="phrase">

                En compañía de nuestras familias
                <br>
                unimos nuestros destinos

            </section>

            <!-- FECHA -->

            <section class="date-section">

                <div>
                    <h3>Viernes</h3>
                    <p>7</p>
                </div>

                <div>
                    <h3>Agosto</h3>
                    <p>2026</p>
                </div>

                <div>
                    <h3>Hora</h3>
                    <p>19:30</p>
                </div>

            </section>

            <!-- MOMENTOS -->

            <section class="timeline">

                <div class="moment">
                    <i class="ti ti-arch"></i>
                    <span>Recepción · 19:30</span>
                </div>

                <div class="moment">
                    <i class="ti ti-heart-handshake"></i>
                    <span>Ceremonia · 20:00</span>
                </div>

                <div class="moment">
                    <i class="ti ti-glass-champagne"></i>
                    <span>Brindis · 22:00</span>
                </div>

            </section>

            <!-- RSVP -->

            <a
                href="#"
                class="rsvp-btn">

                Confirmar asistencia

            </a>

        </div>

    </div>

</body>

</html>
