<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gabo & Miya</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <div class="invitation">

        <!-- IMAGEN COMPLETA -->

        <img

            class="bg"
            alt="Invitación"

        <div class="overlay">

            <!-- NOMBRES -->

            <section class="hero">

                <h1>
                    Gabo
                    <span>&</span>
                    Miya
                </h1>

                <p>
                    En compañía de nuestras familias

                    unimos nuestros destinos
                </p>

            </section>

            <!-- INVITADO -->

            <section class="guest-box">

                <h2>
                    Familia Martínez
                </h2>

                <p>
                    2 lugares asignados
                </p>

            </section>

            <!-- FECHA -->

            <section class="date-section">

                <div>
                    <h3>Viernes</h3>
                    <p>7</p>
                </div>

                <div>
                    <h3>Agosto</h3>
                    <p>2026</p>
                </div>

                <div>
                    <h3>Hora</h3>
                    <p>19:30</p>
                </div>

            </section>

            <!-- RSVP -->

            <a
                href="https://wa.me/5215512345678"
                class="rsvp-btn"
                target="_blank"
            >
                Confirmar asistencia
            </a>

        </div>

    </div>

</html>
